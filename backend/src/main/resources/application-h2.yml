# H2 本地开发 profile — 无需 Docker: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/csdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql

  # 本地开发：从环境变量读取 DEEPSEEK API Key
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
    retry:
      max-attempts: 1

  # 本地无 Kafka 时快速启动
  kafka:
    listener:
      auto-startup: false

# Embedding: 阿里百炼 text-embedding-v3
cs:
  knowledge:
    embedding:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:}
    embedding-model: text-embedding-v3

server:
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    org.springframework.ai.openai.api: TRACE
    org.springframework.web.client.RestClient: DEBUG
